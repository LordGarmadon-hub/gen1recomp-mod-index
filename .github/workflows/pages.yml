name: Build index and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: personal-mod-index-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build index
        env:
          GITHUB_TOKEN: ${{ secrets.MOD_INDEX_API_TOKEN || github.token }}
        run: node scripts/build-index.mjs --releases

      - name: Gate resolved releases
        env:
          GITHUB_TOKEN: ${{ secrets.MOD_INDEX_API_TOKEN || github.token }}
        run: node scripts/gate-releases.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.MOD_INDEX_API_TOKEN || github.token }}
